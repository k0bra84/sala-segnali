name: Aggiorna segnali

on:
  schedule:
    - cron: "7 */4 * * *"   # ogni 4 ore, 7 minuti dopo la chiusura della candela (orario UTC)
  workflow_dispatch:          # permette di avviarlo a mano dal pulsante "Run workflow"

permissions:
  contents: write

concurrency:
  group: aggiorna-segnali
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Esegui il programma
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 signalroom.py

      - name: Salva i risultati
        run: |
          git config user.name "sala-segnali"
          git config user.email "sala-segnali@users.noreply.github.com"
          git add state.json docs
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Aggiornamento segnali"
            git push
          fi
